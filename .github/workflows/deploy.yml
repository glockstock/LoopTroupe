name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guides
        run: node scripts/check-guides.mjs
      - name: Publish site to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish only the site itself (allowlist); docs, specs, spikes,
          # scripts and agent configs are not served as web pages.
          git checkout --orphan gh-pages
          git rm -r -q --cached .
          touch .nojekyll
          git add -f index.html css js .nojekyll
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f origin gh-pages
